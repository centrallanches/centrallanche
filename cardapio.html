<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Lanches - Cardápio</title>
    <style>
        :root {
            --primary: #d32f2f; /* Vermelho */
            --bg-body: #f4f4f4; /* Fundo claro */
            --bg-card: #ffffff; /* Cartão branco */
            --text-main: #333333;
            --text-sec: #666666;
            --border: #e0e0e0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: var(--bg-body); color: var(--text-main); padding-bottom: 80px; }

        header {
            background-color: var(--primary);
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        header h1 { font-size: 1.5rem; font-weight: bold; color: white; }

        .categorias {
            display: flex;
            gap: 10px;
            padding: 15px;
            overflow-x: auto;
            white-space: nowrap;
            background: white;
            border-bottom: 1px solid var(--border);
        }
        .cat-btn {
            background: #eee;
            color: #555;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
        }
        .cat-btn.active { background: var(--primary); color: white; }

        .grid-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 15px;
        }

        .card-produto {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .img-produto {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: #ddd;
        }

        .info-produto { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .nome-produto { font-weight: bold; font-size: 1rem; margin-bottom: 5px; color: var(--text-main); }
        .desc-produto { font-size: 0.8rem; color: var(--text-sec); margin-bottom: 8px; }
        .preco-produto { color: var(--primary); font-weight: bold; font-size: 1.1rem; }
        
        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Carrinho Flutuante */
        .carrinho-float {
            position: fixed;
            bottom: 20px;
            left: 5%;
            width: 90%;
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            border-radius: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4);
            cursor: pointer;
            z-index: 900;
            display: none;
            font-weight: bold;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 20px 20px 0 0;
            padding: 25px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { font-size: 1.3rem; }
        .close-modal { font-size: 1.5rem; cursor: pointer; color: #999; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-sec); font-size: 0.9rem; }
        .form-group input { 
            width: 100%; padding: 12px; 
            background: #f9f9f9; border: 1px solid var(--border); 
            color: var(--text-main); border-radius: 8px; 
            outline: none;
        }
        .form-group input:focus { border-color: var(--primary); }

        .resumo-pedido {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .btn-finalizar {
            background: var(--primary);
            color: white;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-finalizar:disabled { background: #ccc; cursor: not-allowed; }

        /* Modal PIX Específico */
        .modal-pix-wrapper {
            align-items: center; /* Centraliza verticalmente */
        }
        .modal-pix-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            width: 90%;
            max-width: 350px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .qrcode-box {
            background: white;
            padding: 10px;
            margin: 20px auto;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #eee;
            border-radius: 10px;
        }
        .qrcode-box img { width: 100%; height: 100%; object-fit: contain; }
        
        .status-pagamento {
            margin-top: 15px;
            font-weight: 600;
            color: #ff9800;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Central Lanches</h1>
    </header>

    <div class="categorias">
        <button class="cat-btn active" onclick="filtrar('todos')">Todos</button>
        <button class="cat-btn" onclick="filtrar('lanches')">Lanches</button>
        <button class="cat-btn" onclick="filtrar('bebidas')">Bebidas</button>
        <button class="cat-btn" onclick="filtrar('porcoes')">Porções</button>
    </div>

    <div class="grid-produtos" id="lista-produtos">
        <!-- Produtos via JS -->
    </div>

    <div class="carrinho-float" id="btn-carrinho" onclick="abrirCarrinho()">
        <span>🛒 Ver Carrinho</span>
        <span id="total-float">R$ 0,00</span>
    </div>

    <!-- Modal Carrinho -->
    <div class="modal-overlay" id="modal-carrinho">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Seu Pedido</h2>
                <span class="close-modal" onclick="fecharCarrinho()">&times;</span>
            </div>
            
            <div class="resumo-pedido" id="itens-carrinho">
                <!-- Itens -->
            </div>
            
            <div class="form-group">
                <label>Nome Completo:</label>
                <input type="text" id="nome-cliente" placeholder="Ex: João Silva">
            </div>
            <div class="form-group">
                <label>Endereço de Entrega:</label>
                <input type="text" id="endereco-cliente" placeholder="Rua, Número, Bairro">
            </div>

            <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold; margin: 20px 0;">
                <span>Total a Pagar:</span>
                <span id="total-final" style="color: var(--primary);">R$ 0,00</span>
            </div>

            <button class="btn-finalizar" onclick="finalizarPedido()">Finalizar e Pagar com PIX</button>
        </div>
    </div>

    <!-- Modal PIX -->
    <div class="modal-overlay modal-pix-wrapper" id="modal-pix">
        <div class="modal-pix-content">
            <span class="close-modal" style="position:absolute; top:15px; right:20px;" onclick="fecharPix()">&times;</span>
            <h3>Pagamento PIX</h3>
            <p style="color: #666; font-size: 0.9rem; margin-top:5px;">Abra o app do seu banco e escaneie</p>
            
            <div class="qrcode-box">
                <img src="" alt="QR Code Pix" id="img-qr" style="display:none;">
                <div id="loading-qr" style="color:#999;">Gerando código...</div>
            </div>

            <p id="valor-pix" style="font-weight: bold; font-size: 1.3rem; color: var(--text-main);"></p>
            
            <div id="status-pagamento" class="status-pagamento">Aguardando confirmação...</div>
            
            <button onclick="fecharPix()" style="margin-top: 25px; background: white; border: 1px solid #ccc; color: #666; padding: 10px 20px; border-radius: 8px; width: 100%; font-weight: 600;">Já paguei / Fechar</button>
        </div>
    </div>

    <script>
        // --- CONFIGURAÇÃO ---
        const ANOVA_CLIENT_ID = "cms0q5i6j000elp019xciyps3";
        const ANOVA_CLIENT_SECRET = "814e5a2ce114c8f1983f0432b1cb112dde51c79947a75f9816a55aa46953f5ce";
        const TAXA_ENTREGA = 7.00;

        // --- DADOS (Substitua as URLs pelas do seu GitHub) ---
        const produtos = [
            { id: 1, nome: "X-Bacon", preco: 18.00, cat: "lanches", img: "https://via.placeholder.com/150/d32f2f/fff?text=X-Bacon" },
            { id: 2, nome: "X-Salada", preco: 15.00, cat: "lanches", img: "https://via.placeholder.com/150/d32f2f/fff?text=X-Salada" },
            { id: 3, nome: "Coca-Cola 350ml", preco: 6.00, cat: "bebidas", img: "https://via.placeholder.com/150/000/fff?text=Coca" },
            { id: 4, nome: "Batata Frita", preco: 12.00, cat: "porcoes", img: "https://via.placeholder.com/150/ff9800/fff?text=Fritas" }
        ];

        let carrinho = [];

        window.onload = () => {
            renderizarProdutos(produtos);
        };

        function renderizarProdutos(lista) {
            const container = document.getElementById('lista-produtos');
            container.innerHTML = '';
            lista.forEach(p => {
                container.innerHTML += `
                    <div class="card-produto">
                        <img src="${p.img}" class="img-produto" alt="${p.nome}">
                        <div class="info-produto">
                            <div>
                                <div class="nome-produto">${p.nome}</div>
                            </div>
                            <div>
                                <div class="preco-produto">R$ ${p.preco.toFixed(2)}</div>
                                <button class="btn-add" onclick="addCarrinho(${p.id})">Adicionar</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filtrar(categoria) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            
            if(categoria === 'todos') renderizarProdutos(produtos);
            else renderizarProdutos(produtos.filter(p => p.cat === categoria));
        }

        function addCarrinho(id) {
            const item = produtos.find(p => p.id === id);
            carrinho.push(item);
            atualizarCarrinhoUI();
        }

        function atualizarCarrinhoUI() {
            const total = carrinho.reduce((acc, item) => acc + item.preco, 0) + (carrinho.length > 0 ? TAXA_ENTREGA : 0);
            
            document.getElementById('total-float').innerText = `R$ ${total.toFixed(2)}`;
            document.getElementById('btn-carrinho').style.display = carrinho.length > 0 ? 'flex' : 'none';
            
            const listaModal = document.getElementById('itens-carrinho');
            let html = carrinho.map(i => `
                <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:0.95rem;">
                    <span>${i.nome}</span>
                    <span>R$ ${i.preco.toFixed(2)}</span>
                </div>`).join('');
            
            html += `<div style="border-top:1px dashed #ccc; margin-top:10px; padding-top:10px; display:flex; justify-content:space-between; color:#666;"><span>Taxa Entrega</span><span>R$ ${TAXA_ENTREGA.toFixed(2)}</span></div>`;
            
            listaModal.innerHTML = html;
            document.getElementById('total-final').innerText = `R$ ${total.toFixed(2)}`;
        }

        function abrirCarrinho() { document.getElementById('modal-carrinho').style.display = 'flex'; }
        function fecharCarrinho() { document.getElementById('modal-carrinho').style.display = 'none'; }

        // --- PAGAMENTO E API ---
        async function finalizarPedido() {
            const nome = document.getElementById('nome-cliente').value;
            const endereco = document.getElementById('endereco-cliente').value;

            if(!nome || !endereco) {
                alert("Por favor, preencha seu nome e endereço.");
                return;
            }

            const btn = document.querySelector('.btn-finalizar');
            btn.disabled = true;
            btn.textContent = "Processando...";

            const total = carrinho.reduce((acc, item) => acc + item.preco, 0) + TAXA_ENTREGA;
            const pedidoId = Date.now();

            try {
                const dataPix = await gerarPixAnovaPay(total, pedidoId);
                
                console.log("Resposta API:", dataPix);

                let qrCodeContent = "";

                // Lógica robusta para achar o código PIX
                if (dataPix.qr_code_string) qrCodeContent = dataPix.qr_code_string;
                else if (dataPix.emv) qrCodeContent = dataPix.emv;
                else if (dataPix.qr_code) qrCodeContent = dataPix.qr_code;
                else if (dataPix.data && dataPix.data.qr_code) qrCodeContent = dataPix.data.qr_code; // Estrutura aninhada comum

                if(qrCodeContent && qrCodeContent.length > 10) {
                    fecharCarrinho();
                    document.getElementById('modal-pix').style.display = 'flex';
                    document.getElementById('valor-pix').innerText = `R$ ${total.toFixed(2)}`;
                    
                    // Gera imagem do QR Code
                    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(qrCodeContent)}`;
                    const imgEl = document.getElementById('img-qr');
                    imgEl.src = qrUrl;
                    imgEl.style.display = 'block';
                    document.getElementById('loading-qr').style.display = 'none';

                    iniciarMonitoramentoPagamento();
                } else {
                    throw new Error("Não foi possível gerar o QR Code. Verifique o console.");
                }

            } catch (error) {
                console.error(error);
                alert("Erro ao gerar PIX: " + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = "Finalizar e Pagar com PIX";
            }
        }

        async function gerarPixAnovaPay(valor, pedidoId) {
            const response = await fetch("https://api.novapay.com/charges", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "ci": ANOVA_CLIENT_ID,
                    "cs": ANOVA_CLIENT_SECRET
                },
                body: JSON.stringify({
                    amount: Math.round(valor * 100), 
                    description: `Pedido Central Lanches - ${pedidoId}`,
                    payment_method: "PIX",
                    customer: { 
                        name: document.getElementById('nome-cliente').value,
                        document: "00000000000" // CPF fictício para teste
                    } 
                })
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`Erro ${response.status}`);
            }

            return await response.json();
        }

        function iniciarMonitoramentoPagamento() {
            const statusEl = document.getElementById('status-pagamento');
            setTimeout(() => {
                statusEl.textContent = "Pagamento Confirmado! ✅";
                statusEl.style.color = "#4CAF50";
            }, 10000); // Simula confirmação em 10s
        }

        function fecharPix() {
            document.getElementById('modal-pix').style.display = 'none';
            // Reset visual
            document.getElementById('img-qr').style.display = 'none';
            document.getElementById('loading-qr').style.display = 'block';
            document.getElementById('status-pagamento').textContent = "Aguardando confirmação...";
            document.getElementById('status-pagamento').style.color = "#ff9800";
            
            // Opcional: Limpar carrinho após fechar
            // carrinho = []; atualizarCarrinhoUI();
        }

        window.onclick = function(event) {
            if (event.target == document.getElementById('modal-carrinho')) fecharCarrinho();
        }
    </script>
</body>
</html>
