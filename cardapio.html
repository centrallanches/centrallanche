<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio - Central Lanches</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Botão de voltar simples -->
    <div style="text-align: center; padding: 20px;">
        <a href="index.html" style="color: #f4b400; text-decoration: none; font-weight: bold;">&larr; Voltar para Home</a>
    </div>

    <!-- AQUI COMEÇA O CONTORNO AMARELO -->
    <div class="menu-wrapper">
        <h2 class="section-title">Cardápio</h2>

        <div class="cards-container">
            
            <!-- Item 1 -->
            <div class="menu-card">
                <div class="card-info">
                    <h3>X-Bacon Supremo</h3>
                    <p>Burger artesanal, muito bacon e cheddar.</p>
                </div>
                <div class="card-price">R$ 28,90</div>
            </div>

            <!-- Item 2 -->
            <div class="menu-card">
                <div class="card-info">
                    <h3>X-Salada Clássico</h3>
                    <p>Burger, alface, tomate e maionese verde.</p>
                </div>
                <div class="card-price">R$ 22,50</div>
            </div>

        </div>
    </div>
    <!-- FIM DO CONTORNO AMARELO -->

</body>
</html>
