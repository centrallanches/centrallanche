<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio - Central Lanches</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div style="text-align: center; padding: 20px;">
        <a href="index.html" style="color: #f4b400; text-decoration: none; font-weight: bold;">&larr; Voltar</a>
    </div>

    <div class="menu-wrapper">
        <h2 class="section-title">Cardápio</h2>

        <div class="cards-container">
            
            <!-- X-Salada -->
            <div class="menu-card">
                <img src="xsalada.jpg" alt="X-Salada" class="card-img">
                <div class="card-info">
                    <h3>X-SALADA</h3>
                    <p>Pão, burger, queijo, presunto, alface e tomate.</p>
                    <div class="card-price">R$ 17,64</div>
                </div>
            </div>

            <!-- X-Bacon -->
            <div class="menu-card">
                <img src="xbacon.jpg" alt="X-Bacon" class="card-img">
                <div class="card-info">
                    <h3>X-BACON</h3>
                    <p>Pão, burger, bacon, queijo e molho especial.</p>
                    <div class="card-price">R$ 28,90</div>
                </div>
            </div>

            <!-- X-Duplo -->
            <div class="menu-card">
                <img src="xduplo.jpg" alt="X-Duplo" class="card-img">
                <div class="card-info">
                    <h3>X-DUPLO</h3>
                    <p>Dois burgers, dobro de queijo e presunto.</p>
                    <div class="card-price">R$ 29,90</div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
