<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Central Lanche</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#b30000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:360px;
    background:#ffffff;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.logo{
    width:160px;
    height:160px;
    border-radius:50%;
    border:5px solid #b30000;
    object-fit:cover;
    margin-bottom:20px;
}

h1{
    color:#b30000;
    font-size:28px;
    margin-bottom:20px;
}

.botao{
    display:block;
    background:#b30000;
    color:#fff;
    text-decoration:none;
    padding:18px;
    border-radius:12px;
    font-size:22px;
    font-weight:bold;
    transition:.3s;
}

.botao:hover{
    background:#900000;
}
</style>

</head>

<body>

<div class="card">

<img src="logo.png" class="logo" alt="Central Lanche">

<h1>👇 FAÇA SEU PEDIDO AQUI 👇</h1>

<a class="botao" href="https://SEU-LINK-DO-CARDAPIO">
📖 CARDÁPIO
</a>

</div>

</body>
</html>
